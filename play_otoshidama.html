<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お年玉キャッチ</title>
<style>
:root { --bg:#FFF8E1; --surface:#FFFFFF; --fg:#2C2C2C; --muted:#6B7280; --brand:#173993; --on-brand:#FFFFFF; --accent:#FCC600; --soft:#D6DEF0; --play:#FDF3C4; --red:#C8102E; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141B2D; --surface:#1E2740; --fg:#F4F5F8; --muted:#B4BCD0; --brand:#7FA0F0; --on-brand:#141B2D; --soft:#2A3656; --play:#24304F; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#141B2D; --surface:#1E2740; --fg:#F4F5F8; --muted:#B4BCD0; --brand:#7FA0F0; --on-brand:#141B2D; --soft:#2A3656; --play:#24304F; color-scheme: dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif; font-size:16px; line-height:1.7; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
main { max-width:480px; margin:0 auto; padding-block:20px 32px; display:flex; flex-direction:column; gap:14px; }
.card { background:var(--surface); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; box-shadow:0 2px 0 var(--soft); }
h1 { font-size:24px; line-height:1.35; margin:0; }
p { margin:0; color:var(--muted); }
.top { display:flex; justify-content:space-between; gap:12px; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
#left.rush { color:var(--red); }
.bar { height:12px; border-radius:999px; background:var(--soft); overflow:hidden; }
.bar span { display:block; height:100%; width:100%; background:var(--accent); transform-origin:left center; }
.field { position:relative; height:min(62vh,520px); border-radius:20px; background:var(--play); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
.item { position:absolute; top:-90px; cursor:pointer; }
.packet { position:relative; width:62px; height:88px; background:var(--red); border:3px solid var(--accent); border-radius:10px; box-shadow:0 3px 0 rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; }
.packet span { writing-mode:vertical-rl; color:var(--accent); font-weight:700; font-size:18px; letter-spacing:2px; }
.packet::before { content:""; position:absolute; left:0; right:0; top:12px; height:6px; background:var(--accent); opacity:.85; }
.packet.alt { border-color:#fff; }
.packet.alt span { color:#fff; font-size:16px; letter-spacing:1px; }
.packet.alt::before { background:#fff; }
.packet.alt-blue { background:#1E5BB8; }
.packet.alt-pink { background:#D9487A; }
.packet.foil { border:3px solid #7a5a00; background:linear-gradient(135deg,#B8860B 0%,#FFE27A 40%,#C9A227 60%,#FFF3B0 80%,#B8860B 100%); background-size:200% 200%; animation:shine 1.6s linear infinite; box-shadow:0 3px 0 #7a5a00, 0 0 14px rgba(255,226,122,.9); }
.packet.foil span { color:#5a3d00; }
.packet.foil::before { background:#7a5a00; }
.pop { animation:pop .22s ease-out forwards; pointer-events:none; }
.plus { position:absolute; z-index:4; font-weight:700; font-size:22px; color:var(--brand); pointer-events:none; animation:up .6s ease-out forwards; white-space:nowrap; }
.plus.miss { color:#6B7280; font-size:18px; }
.toast { position:absolute; top:38%; left:0; right:0; text-align:center; font-size:32px; font-weight:700; color:var(--red); pointer-events:none; animation:toast 1.1s ease-out forwards; z-index:4; }
.dropline { position:absolute; left:0; right:0; bottom:0; height:34px; z-index:3; background:rgba(200,16,46,.9); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; pointer-events:none; }
@keyframes pop { to { transform:scale(1.5); opacity:0; } }
@keyframes up { to { transform:translateY(-44px); opacity:0; } }
@keyframes toast { 0% { transform:scale(1.6); opacity:0; } 20% { transform:scale(1); opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }
@keyframes shine { 0% { background-position:0% 50%; } 100% { background-position:200% 50%; } }
.layer { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--play); padding:24px; text-align:center; }
.layer p { color:var(--fg); font-size:20px; font-weight:700; }
.how { font-size:17px !important; line-height:1.8; background:var(--surface); border-radius:14px; padding:12px 14px; }
.done-layer { background:var(--red); }
.done-big { font-size:56px; font-weight:700; color:#FFFFFF; line-height:1.2; letter-spacing:2px; }
.done-sub { font-size:24px; font-weight:700; color:#FFFFFF; }
.btn { appearance:none; border:0; cursor:pointer; font:inherit; font-weight:700; font-size:18px; padding:15px 20px; border-radius:999px; background:var(--brand); color:var(--on-brand); text-decoration:none; text-align:center; display:block; width:100%; }
.btn:disabled { opacity:.4; cursor:default; }
.btn.sub { background:var(--accent); color:#2C2C2C; }
.btn.ghost { background:transparent; color:var(--brand); border:2px solid var(--brand); }
.btn:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.hidden { display:none !important; }
.big { font-size:48px; font-weight:700; color:var(--brand); line-height:1; font-variant-numeric:tabular-nums; }
.title { font-size:22px; font-weight:700; color:var(--fg); }
.bubble { background:var(--soft); border-radius:16px; padding:14px 16px; font-size:15px; color:var(--fg); }
.bubble b { display:block; color:var(--brand); margin-bottom:4px; }
.hero { position:relative; overflow:hidden; background:linear-gradient(135deg,#C8102E 0%,#E63946 60%,#FF8A3D 100%); color:#fff; border-radius:24px; padding:24px 20px 22px; box-shadow:0 5px 0 #8a0a20; display:flex; flex-direction:column; gap:10px; }
.hero::after { content:"✨"; position:absolute; right:14px; top:12px; font-size:28px; animation:twinkle 1.6s ease-in-out infinite; }
.sticker { align-self:flex-start; background:var(--accent); color:#2C2C2C; font-weight:700; font-size:14px; padding:4px 14px; border-radius:999px; transform:rotate(-3deg); box-shadow:0 2px 0 #b38600; }
.hero h1 { font-size:42px; line-height:1.2; margin:6px 0 0; color:#fff; font-weight:700; letter-spacing:3px; text-shadow:0 4px 0 #8a0a20; }
.hero h1 span { display:inline-block; color:var(--accent); animation:bob 1.8s ease-in-out infinite; }
.hero h1 .w2 { animation-delay:.15s; }
.hero h1 .w3 { animation-delay:.3s; }
.lead { color:#FFF4D6; font-size:16px; margin:0; }
.lead b { color:var(--accent); font-size:20px; }
@keyframes bob { 50% { transform:translateY(-6px) rotate(-4deg); } }
@keyframes twinkle { 50% { opacity:.4; transform:scale(.8) rotate(15deg); } }
.go-big { font-size:64px; line-height:1; animation:bob 1.8s ease-in-out infinite; }
.btn.go { background:var(--accent); color:#2C2C2C; font-size:22px; padding:18px 28px; box-shadow:0 6px 0 #b38600; }
.btn.go:not(:disabled) { animation:pulse 1.4s ease-in-out infinite; }
.btn.go:active { transform:translateY(4px); box-shadow:0 2px 0 #b38600; }
.go-ico { display:inline-block; animation:bob 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform:scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .pop, .plus, .toast, .hero h1 span, .hero::after, .go-big, .go-ico, .btn.go:not(:disabled), .packet.foil { animation:none; } .pop { opacity:0; } .toast { opacity:1; } }
</style>
</head>
<body>
<main>
  <div class="hero">
    <span class="sticker">🧧 1月のおたのしみ</span>
    <h1><span class="w1">お</span><span class="w2">年</span><span class="w3">玉</span>キャッチ</h1>
    <p class="lead">降ってくるお年玉をタップでキャッチ！<br>きらきらのお年玉もあるかも！？<br>制限時間は<b>10秒</b>です。</p>
  </div>

  <div class="card" id="play">
    <div class="top"><span id="left">残り 10 秒</span><span id="count">取った数 0</span></div>
    <div class="bar"><span id="timebar"></span></div>
    <div class="field" id="field">
      <div class="dropline">ここまでにタップ！ ▼</div>
      <div class="layer" id="start">
        <div class="go-big">🧧</div>
        <p>準備はいい？</p>
        <p class="how">👆 上から落ちてくるお年玉を<br>タップしてキャッチしてね</p>
        <button class="btn go" id="go" disabled><span class="go-ico">🎁</span> スタート！</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="result">
    <p>あなたの結果</p>
    <div class="big" id="score">0 個</div>
    <div class="title" id="title"></div>
    <div class="bubble"><b>いっしょにとれたもの</b><span id="others"></span></div>
    <div class="bubble"><b id="factTitle">1月の印刷の豆知識</b><span id="fact"></span></div>
    <a class="btn sub" id="coupon" href="#" target="_blank" rel="noopener">公式LINEでクーポンをもらう</a>
    <button class="btn ghost" id="retry">もう一回あそぶ</button>
  </div>
</main>

<script>
let cfg = null;
let running = false, startT = 0, lastT = 0, lastSpawn = 0, rafId = 0, caught = 0, items = [];
let rushed = false, collected = {}, foilCount = 0;
const DECOYS = [
  { label: "お手紙", cls: "alt-pink", msg: "誰かへのお手紙" },
  { label: "年賀状", cls: "alt-blue", msg: "キラキラの年賀状" },
];
const FOIL_MSG = "きらきらのお年玉";
const $ = (id) => document.getElementById(id);
const field = $("field");

function setLeft(sec) { $("left").textContent = `残り ${Math.ceil(sec)} 秒`; }
function setCount() { $("count").textContent = `取った数 ${caught}`; }

function spawn() {
  const r = Math.random();
  const el = document.createElement("div");
  el.className = "item";
  let type, speed, label = "";
  if (r < 0.08) {
    type = "foil";
    el.innerHTML = '<div class="packet foil"><span>お年玉</span></div>';
    speed = 260 + Math.random() * 80;
  } else if (r < 0.6) {
    type = "gold";
    el.innerHTML = '<div class="packet"><span>お年玉</span></div>';
    speed = 200 + Math.random() * 120;
  } else {
    type = "decoy";
    const d = DECOYS[Math.floor(Math.random() * DECOYS.length)];
    label = d.msg;
    el.innerHTML = `<div class="packet alt ${d.cls}"><span>${d.label}</span></div>`;
    speed = 230 + Math.random() * 150;
  }
  el.style.left = Math.round(Math.random() * (field.clientWidth - 62)) + "px";
  const it = { el, y: -90, speed, type, label, dead: false };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(it); });
  field.appendChild(el);
  items.push(it);
}

function popupAt(x, y, text, miss = false) {
  const p = document.createElement("div");
  p.className = miss ? "plus miss" : "plus";
  p.textContent = text;
  p.style.left = x + "px";
  p.style.top = y + "px";
  field.appendChild(p);
  setTimeout(() => p.remove(), 650);
}

function showToast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  field.appendChild(t);
  setTimeout(() => t.remove(), 1100);
}

function hit(it) {
  if (it.dead || !running) return;
  it.dead = true;
  it.el.classList.add("pop");
  setTimeout(() => it.el.remove(), 230);
  const x = it.el.offsetLeft;
  if (it.type === "gold") {
    caught += 1; setCount();
    popupAt(x, it.y, "+1");
  } else if (it.type === "foil") {
    caught += 3; setCount(); foilCount++;
    collected[FOIL_MSG] = (collected[FOIL_MSG] || 0) + 1;
    popupAt(x, it.y, "+3 ボーナス！");
  } else {
    collected[it.label] = (collected[it.label] || 0) + 1;
    popupAt(x, it.y, "ゲット");
  }
}

function frame(ts) {
  if (!running) return;
  const dt = (ts - lastT) / 1000;
  lastT = ts;
  const left = Math.max(0, cfg.seconds - (ts - startT) / 1000);
  const rush = left <= 5;
  setLeft(left);
  $("left").classList.toggle("rush", rush);
  if (rush && !rushed) { rushed = true; showToast("ラストスパート！"); }
  $("timebar").style.transform = `scaleX(${left / cfg.seconds})`;
  if (ts - lastSpawn > (rush ? 220 : 380)) { spawn(); lastSpawn = ts; }
  const H = field.clientHeight;
  const mult = rush ? 1.35 : 1;
  items.forEach((it) => {
    if (it.dead) return;
    it.y += it.speed * mult * dt;
    it.el.style.top = it.y + "px";
    if (it.y > H - 34) {
      it.dead = true;
      it.el.remove();
      if (it.type !== "decoy") popupAt(it.el.offsetLeft, H - 70, "にがした…", true);
    }
  });
  items = items.filter((it) => !it.dead);
  if (left <= 0) { finish(); return; }
  rafId = requestAnimationFrame(frame);
}

function resetState() {
  caught = 0; collected = {}; foilCount = 0; rushed = false;
}

function start() {
  $("start").classList.add("hidden");
  resetState();
  setCount(); setLeft(cfg.seconds);
  $("left").classList.remove("rush");
  running = true;
  startT = performance.now(); lastT = startT; lastSpawn = startT - 400;
  rafId = requestAnimationFrame(frame);
}

function finish() {
  running = false;
  cancelAnimationFrame(rafId);
  items.forEach((it) => it.el.remove());
  items = [];
  const done = document.createElement("div");
  done.className = "layer done-layer";
  done.innerHTML = `<div class="done-big">おしまい！</div><div class="done-sub">お年玉 ${caught} 個 ゲット！</div>`;
  field.appendChild(done);
  setTimeout(showResult, 1400);
}

function showResult() {
  const cleared = caught >= cfg.target;
  const entries = Object.entries(collected);
  $("score").textContent = `${caught} 個`;
  $("title").textContent = caught >= 20 ? "うそでしょ！？ 大量ゲット！！"
    : cleared ? "たくさん取れました！ すごい！"
    : "もっとキャッチできるかも！";

  const box = $("others");
  box.innerHTML = "";
  if (!entries.length) box.textContent = "お年玉だけでした";
  entries.forEach(([msg, n]) => {
    const line = document.createElement("div");
    line.style.marginTop = "4px";
    line.textContent = `・${msg}${n > 1 ? ` ×${n}` : ""}`;
    box.appendChild(line);
  });

  if (foilCount > 0) {
    $("factTitle").textContent = "きらきら仕上げの豆知識";
    $("fact").textContent = cfg.foilFact;
  } else {
    $("factTitle").textContent = "1月の印刷の豆知識";
    $("fact").textContent = cfg.fact;
  }
  $("coupon").href = cfg.couponUrl;
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("go").addEventListener("click", start);

$("retry").addEventListener("click", () => {
  items.forEach((it) => it.el.remove());
  items = [];
  field.querySelectorAll(".layer:not(#start), .toast, .plus").forEach((n) => n.remove());
  $("start").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("timebar").style.transform = "scaleX(1)";
  $("left").classList.remove("rush");
  resetState();
  setLeft(cfg.seconds); setCount();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

fetch("data/month.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((all) => {
    const o = all.otoshidama;
    cfg = { seconds: o.seconds, target: o.target, fact: o.fact, foilFact: o.foilFact || o.fact, couponUrl: all.couponUrl };
    setLeft(cfg.seconds); setCount();
    $("go").disabled = false;
  })
  .catch(() => {
    $("start").innerHTML = "<p>読み込みに失敗しました。ページを開き直してください。</p>";
  });
</script>
</body>
</html>
